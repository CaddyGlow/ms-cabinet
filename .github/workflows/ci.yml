name: cabinet CI
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_call:
    inputs:
      ms-compress-sha:
        description: Exact dependency commit resolved by the release workflow
        required: false
        type: string
        default: ''
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
defaults:
  run:
    working-directory: cabinet
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cabinet
    steps:
      - uses: actions/checkout@v7
        with:
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ inputs.ms-compress-sha || vars.MS_COMPRESS_REF }}
          path: ms-compress
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            cabinet -> target
            cabinet/fuzz -> target
      - run: cargo fmt --all -- --check
      - run: cargo test --all-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo run --manifest-path fuzz/Cargo.toml --locked --bin seed -- "$RUNNER_TEMP/cabinet-corpus"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ inputs.ms-compress-sha || vars.MS_COMPRESS_REF }}
          path: ms-compress
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validation
          workspaces: |
            cabinet -> target
            cabinet/fuzz -> target
      - run: cargo test --all-features --locked
