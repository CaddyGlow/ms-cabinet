name: CAB Fuzz
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: cabinet
    steps:
      - uses: actions/checkout@v7
        with:
          path: cabinet
      - uses: actions/checkout@v7
        with:
          repository: ${{ vars.MS_COMPRESS_REPOSITORY || format('{0}/ms-compress', github.repository_owner) }}
          ref: ${{ vars.MS_COMPRESS_REF }}
          path: ms-compress
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: fuzz
          workspaces: |
            cabinet -> target
            cabinet/fuzz -> target
      - run: sudo apt-get update && sudo apt-get install -y binutils-dev libunwind-dev liblzma-dev build-essential
      - run: cargo install honggfuzz --version 0.5.62 --locked
      - run: bash scripts/fuzz.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cabinet-fuzz-evidence
          path: cabinet/target/fuzz
          retention-days: 30
